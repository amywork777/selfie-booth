<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Selfie booth">
  <title>Selfie booth</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="count">
  <main class="booth">
    <header class="top">
      <h1 class="title">Selfie booth</h1>
      <div class="top-right">
        <p class="status" id="status">Checking printer</p>
        <button type="button" class="choice small" id="settings" aria-expanded="false" aria-controls="host">Settings</button>
      </div>
    </header>

    <section class="pick" aria-labelledby="pick-title">
      <h2 class="step" id="pick-title">How many photos?</h2>
      <div class="tiles" id="count-tiles" role="radiogroup" aria-labelledby="pick-title"></div>
      <div class="tiles" id="pattern-tiles" role="radiogroup" aria-labelledby="pick-title"></div>
      <div class="host" id="host" hidden>
        <div class="field">
          <span class="label">Booth settings</span>
          <div class="choices">
            <button type="button" class="choice" id="sound" aria-pressed="true">Sound</button>
          </div>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="prev">Back</button>
        <button type="button" class="btn primary" id="next">Next</button>
      </div>
    </section>

    <section class="stage" aria-label="Label preview">
      <div class="sheet">
        <div class="paper">
          <canvas id="label" aria-label="Your photo as it will print"></canvas>
          <div class="count" id="count" aria-live="assertive"></div>
          <div class="flash" id="flash"></div>
          <div class="message" id="message" hidden></div>
        </div>
        <span class="sticker" aria-hidden="true">Free<br>prints</span>
      </div>
    </section>

    <section class="controls">
      <h2 class="step" id="step-title"></h2>
      <div class="caption-step">
        <input id="caption" type="text" maxlength="28" placeholder="Type a caption, or leave it blank" autocomplete="off" enterkeyhint="done" aria-labelledby="step-title">
        <button type="button" class="choice" id="date" aria-pressed="true">Date</button>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="back">Back</button>
        <button type="button" class="btn primary" id="to-photo">Next</button>
        <button type="button" class="btn primary" id="shoot">Take photo</button>
        <button type="button" class="btn" id="retake">Retake</button>
        <button type="button" class="btn primary" id="print">Print</button>
      </div>
    </section>
  </main>

  <video id="video" playsinline muted autoplay></video>
  <script type="module" src="app.js"></script>
</body>
</html>
