<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Selfie booth">
  <title>Selfie booth</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="pick">
  <main class="booth">
    <header class="top">
      <h1 class="title">Selfie booth</h1>
      <p class="status" id="status">Checking printer</p>
    </header>

    <section class="pick" aria-label="Pick a layout">
      <h2 class="label">Step 1: pick a layout</h2>
      <div class="tiles" id="tiles"></div>
      <div class="host">
        <label class="field">
          <span class="label">Caption</span>
          <input id="caption" type="text" maxlength="28" placeholder="Add a caption" autocomplete="off" enterkeyhint="done">
        </label>
        <div class="field">
          <span class="label">Extras</span>
          <div class="choices">
            <button type="button" class="choice" id="date" aria-pressed="true">Date</button>
            <button type="button" class="choice" id="sound" aria-pressed="true">Sound</button>
          </div>
        </div>
      </div>
    </section>

    <section class="stage" aria-label="Label preview">
      <div class="sheet">
        <div class="paper">
          <canvas id="label" aria-label="Your photo as it will print"></canvas>
          <div class="count" id="count" aria-live="assertive"></div>
          <div class="flash" id="flash"></div>
          <div class="message" id="message" hidden></div>
        </div>
        <span class="sticker" aria-hidden="true">Free<br>prints</span>
      </div>
    </section>

    <section class="controls">
      <div class="options" id="options">
        <div class="field wide">
          <span class="label">Step 2: stickers</span>
          <div class="choices" id="stickers" role="radiogroup" aria-label="Stickers"></div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="back">Layouts</button>
        <button type="button" class="btn primary" id="shoot">Take photo</button>
        <button type="button" class="btn" id="retake">Retake</button>
        <button type="button" class="btn primary" id="print">Print</button>
      </div>
    </section>
  </main>

  <video id="video" playsinline muted autoplay></video>
  <script type="module" src="app.js"></script>
</body>
</html>
